<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Neighborhood</title>
    <meta name="description" content="A solar system for curious kids. Click a planet to learn about it." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050508'/><circle cx='16' cy='16' r='5' fill='%23ffcf6b'/><circle cx='25' cy='16' r='2' fill='%236ec6ff'/></svg>" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <canvas id="stars"></canvas>
    <canvas id="space"></canvas>
    <canvas id="overlay"></canvas>

    <header class="hud hud-top">
      <div class="brand">
        <span class="brand-mark"></span>
        <h1 data-i18n="brand">Space Neighborhood</h1>
      </div>
      <div class="clock">
        <span id="time">0y 0d</span>
      </div>
      <div class="status">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="pt">PT</button>
        </div>
        <span id="follow-flag">looking around</span>
        <button type="button" class="text-btn" id="btn-menu" aria-expanded="true" data-i18n="hide">Hide</button>
      </div>
    </header>

    <aside id="card" class="card">
      <p id="card-role" class="card-role"></p>
      <h2 id="card-name"></h2>
      <p id="card-blurb"></p>
      <p id="card-know" class="did-you-know"></p>
      <dl id="card-stats" class="stats"></dl>
    </aside>

    <aside id="event" class="event" hidden>
      <p class="event-kicker" data-i18n="ui.happening">What's happening</p>
      <h2 id="event-title"></h2>
      <p id="event-body"></p>
    </aside>

    <nav id="planet-bar" class="planet-bar" data-i18n-aria="ui.worlds" aria-label="Go to a world"></nav>

    <p class="hint" id="hint" data-i18n="hint">click the Sun, a planet, the Moon, or the asteroid belt</p>

    <aside id="menu" class="menu" aria-label="Controls">
      <section>
        <h3 data-i18n="ui.learn">Learn</h3>
        <p class="lede" data-i18n="ui.learnLede">Shadows and the best nights to look up.</p>
        <button type="button" class="menu-action" data-learn="eclipse-solar">
          <strong data-i18n="learn.eclipse-solar.title">Total solar eclipse</strong>
          <em data-i18n="learn.eclipse-solar.lede">The Moon covers the Sun. Day turns dark for a few minutes</em>
        </button>
        <button type="button" class="menu-action" data-learn="eclipse-annular">
          <strong data-i18n="learn.eclipse-annular.title">Ring of fire</strong>
          <em data-i18n="learn.eclipse-annular.lede">The Moon is a little too far away to cover the whole Sun</em>
        </button>
        <button type="button" class="menu-action" data-learn="eclipse-lunar">
          <strong data-i18n="learn.eclipse-lunar.title">Blood Moon</strong>
          <em data-i18n="learn.eclipse-lunar.lede">Earth’s shadow makes the Moon look copper-red</em>
        </button>
        <button type="button" class="menu-action" data-learn="mercury">
          <strong data-i18n="learn.mercury.title">Find Mercury</strong>
          <em data-i18n="learn.mercury.lede">The evening star — low, fast, and close to the Sun</em>
        </button>
        <button type="button" class="menu-action" data-learn="venus">
          <strong data-i18n="learn.venus.title">Find Venus at dawn</strong>
          <em data-i18n="learn.venus.lede">The morning star — the brightest thing after Sun and Moon</em>
        </button>
        <button type="button" class="menu-action" data-learn="mars">
          <strong data-i18n="learn.mars.title">Mars all night</strong>
          <em data-i18n="learn.mars.lede">Opposition: Mars rises at sunset and stays up till morning</em>
        </button>
        <button type="button" class="menu-action" data-learn="jupiter">
          <strong data-i18n="learn.jupiter.title">Jupiter all night</strong>
          <em data-i18n="learn.jupiter.lede">Opposition: the giant planet is easy to spot after dark</em>
        </button>
        <button type="button" class="menu-action" data-learn="saturn">
          <strong data-i18n="learn.saturn.title">Saturn all night</strong>
          <em data-i18n="learn.saturn.lede">Opposition: the best time to look at the rings</em>
        </button>
      </section>

      <section>
        <h3 data-i18n="ui.look">Look</h3>
        <p class="lede" data-i18n="ui.lookLede">Zoom to a neighborhood.</p>
        <div class="row" id="views"></div>
      </section>

      <section>
        <h3 data-i18n="ui.show">Show</h3>
        <p class="lede" data-i18n="ui.showLede">Turn labels and extra details on or off.</p>
        <label class="toggle">
          <input type="checkbox" data-flag="labels" checked />
          <span class="switch"></span>
          <span class="toggle-copy">
            <strong data-i18n="ui.names">Names</strong>
            <em data-i18n="ui.namesLede">Labels on planets</em>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-flag="orbits" checked />
          <span class="switch"></span>
          <span class="toggle-copy">
            <strong data-i18n="ui.orbits">Orbits</strong>
            <em data-i18n="ui.orbitsLede">The paths planets follow</em>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-flag="asteroids" checked />
          <span class="switch"></span>
          <span class="toggle-copy">
            <strong data-i18n="ui.belt">Asteroid belt</strong>
            <em data-i18n="ui.beltLede">Rocks between Mars and Jupiter</em>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-flag="trails" checked />
          <span class="switch"></span>
          <span class="toggle-copy">
            <strong data-i18n="ui.trails">Trails</strong>
            <em data-i18n="ui.trailsLede">Glow behind a spaceship</em>
          </span>
        </label>
      </section>

      <section>
        <h3 data-i18n="ui.startOver">Start over</h3>
        <div class="row">
          <button type="button" id="btn-reset" data-i18n="ui.reset">Reset</button>
          <button type="button" id="btn-share" data-i18n="ui.share">Share</button>
          <button type="button" id="btn-png" data-i18n="ui.png">PNG</button>
        </div>
      </section>
    </aside>

    <footer class="speed-dock" aria-label="Simulation speed">
      <button type="button" class="speed-btn pause" id="speed-pause" aria-label="Pause" title="Pause">
        <span class="pause-pip"></span>
        <span class="pause-pip"></span>
      </button>
      <div class="speed-group" id="speeds" role="group" aria-label="Speed"></div>
    </footer>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
